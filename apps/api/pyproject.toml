[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6",
  "pgvector==0.4.0",
  "alembic==1.15.2",
  "pydantic-settings==2.8.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.4", "mypy==1.15.0", "httpx==0.28.1"]
local = ["sentence-transformers==4.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["repomind*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
