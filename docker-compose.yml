services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: repomind
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://repomind:repomind@db:5432/repomind
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1/interactions}
      GEMINI_PRIMARY_MODEL: ${GEMINI_PRIMARY_MODEL:-gemini-3.8-flash}
      GEMINI_SECONDARY_MODEL: ${GEMINI_SECONDARY_MODEL:-gemini-3.7-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-45}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-token_overlap}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      GLOBAL_RATE_LIMIT_PER_MINUTE: ${GLOBAL_RATE_LIMIT_PER_MINUTE:-120}
      MAX_ACTIVE_INGESTIONS: ${MAX_ACTIVE_INGESTIONS:-8}
      MAX_CONCURRENT_QUERIES: ${MAX_CONCURRENT_QUERIES:-4}
      MAX_FILES: ${MAX_FILES:-5000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-524288}
      MAX_TOTAL_BYTES: ${MAX_TOTAL_BYTES:-26214400}
      MAX_CHUNKS: ${MAX_CHUNKS:-25000}
      EVIDENCE_GATE_MIN_SCORE: ${EVIDENCE_GATE_MIN_SCORE:-0.30}
      EVIDENCE_GATE_MIN_SIGNALS: ${EVIDENCE_GATE_MIN_SIGNALS:-2}
      EVIDENCE_GATE_MIN_QUERY_TERMS: ${EVIDENCE_GATE_MIN_QUERY_TERMS:-1}
      EVIDENCE_GATE_MIN_LEXICAL_COVERAGE: ${EVIDENCE_GATE_MIN_LEXICAL_COVERAGE:-0.20}
      EVIDENCE_GATE_MIN_DENSE_SIMILARITY: ${EVIDENCE_GATE_MIN_DENSE_SIMILARITY:-0.25}
      EVIDENCE_GATE_MIN_RANK_AGREEMENT: ${EVIDENCE_GATE_MIN_RANK_AGREEMENT:-0.20}
      EVIDENCE_GATE_MIN_RERANKER_OVERLAP: ${EVIDENCE_GATE_MIN_RERANKER_OVERLAP:-0.20}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn repomind.api:app --host 0.0.0.0 --port 8000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  pgdata:
