services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: repomind
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://repomind:repomind@db:5432/repomind
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-token_overlap}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      MAX_FILES: ${MAX_FILES:-5000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-524288}
      MAX_TOTAL_BYTES: ${MAX_TOTAL_BYTES:-26214400}
      MAX_CHUNKS: ${MAX_CHUNKS:-25000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn repomind.api:app --host 0.0.0.0 --port 8000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  pgdata:
